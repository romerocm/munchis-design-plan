name: Tests

on:
  pull_request:
    branches: [trunk, main]
  push:
    branches: [trunk, main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-integration:
    name: Unit / Component / Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run component tests
        run: npm run test:component

      - name: Run integration tests
        run: npm run test:integration

  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: unit-and-integration
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chrome, mobile-chrome, mobile-safari]
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      NEXT_PUBLIC_APP_URL: http://localhost:3695
      BAKER_EMAIL: ${{ secrets.BAKER_EMAIL }}
      BAKER_PASSWORD: ${{ secrets.BAKER_PASSWORD }}
      WOMPI_SANDBOX: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Check Supabase secrets
        id: check-secrets
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ Supabase secrets not configured — skipping E2E"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check-secrets.outputs.skip != 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.check-secrets.outputs.skip != 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.check-secrets.outputs.skip != 'true'
        run: npx playwright install --with-deps ${{ matrix.project == 'mobile-safari' && 'webkit' || 'chromium' }}

      - name: Build Next.js
        if: steps.check-secrets.outputs.skip != 'true'
        run: |
          npm run build
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public 2>/dev/null || true

      - name: Run E2E tests
        if: steps.check-secrets.outputs.skip != 'true'
        run: npx playwright test --config e2e/playwright.config.ts --project=${{ matrix.project }}

      - name: Upload test report
        if: always() && steps.check-secrets.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7
