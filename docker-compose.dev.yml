services:
  web:
    image: munchis-web-${WORKSPACE_NAME:-default}
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: munchis-web-${WORKSPACE_NAME:-default}
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env.local
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: npm run dev
    restart: unless-stopped

volumes:
  node_modules:
